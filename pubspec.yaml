name: arrivo
description: "Never miss your stop again — a location-based alarm app built with Flutter."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3

  # Location & maps
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  geofence_service: ^5.0.1

  # Notifications
  flutter_local_notifications: ^17.2.3

  # State management
  provider: ^6.1.2

  # Utilities
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/